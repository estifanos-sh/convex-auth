name: Package Preview

concurrency:
  group: package-preview-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "convex/**"
      - "packages/auth/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"
      - ".github/workflows/preview.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to publish as an ephemeral package preview."
        required: false
        default: main
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  preview:
    name: Build and publish ephemeral package
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.head.sha }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24.15.0
          cache: true
          run-install: |
            args: ['--frozen-lockfile']

      - name: Build and validate package
        run: |
          vp run typecheck
          vp test --run --project convex --project node
          vp run '@estifanos-sh/convex-auth#build'

      - name: Publish PR package preview
        if: github.event_name == 'pull_request'
        run: >
          vp exec pkg-pr-new publish ./packages/auth
          --pnpm
          --no-compact
          --comment=update
          --commentWithSha
          --packageManager=npm

      - name: Publish manual package preview
        if: github.event_name == 'workflow_dispatch'
        run: >
          vp exec pkg-pr-new publish ./packages/auth
          --pnpm
          --no-compact
          --packageManager=npm
