name: Deploy Docs

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy. Defaults to the current branch."
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - "convex/**"
      - "docs/**"
      - "packages/auth/src/**"
      - "packages/auth/package.json"
      - "scripts/docsstatic.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-docs.yml"

concurrency:
  group: deploy-docs-${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      PUBLIC_DEPLOYMENT_ENV: production

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24.15.0
          cache: true
          run-install: |
            args: ['--frozen-lockfile']

      - name: Deploy docs backend and site
        run: vp run deploy:docs
