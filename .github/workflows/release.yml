name: npm Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string
  pull_request_target:
    types:
      - closed

concurrency:
  group: release-package-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  readiness:
    name: Release readiness
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'npm package')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Validate version and release channel
        working-directory: packages/auth
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          BASE_VERSION=$(
            git show "$BASE_SHA:packages/auth/package.json" |
              node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version"
          )

          if [[ "$VERSION" == "$BASE_VERSION" ]]; then
            echo "::error::The npm package label requires a version change from $BASE_VERSION."
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::npm releases require a stable x.y.z version. Use the pkg.pr.new package preview instead."
            exit 1
          fi

          if ! node -e '
            const [base, next] = process.argv.slice(1).map((version) =>
              version.split(".").map(Number),
            );
            for (let i = 0; i < 3; i += 1) {
              if (next[i] > base[i]) process.exit(0);
              if (next[i] < base[i]) process.exit(1);
            }
            process.exit(1);
          ' "$BASE_VERSION" "$VERSION"; then
            echo "::error::Version $VERSION must be newer than $BASE_VERSION."
            exit 1
          fi

          if npm view "$PACKAGE_NAME@$VERSION" version --json >/dev/null 2>&1; then
            echo "::error::$PACKAGE_NAME@$VERSION is already published."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Git tag v$VERSION already exists."
            exit 1
          fi

          {
            echo "## npm release"
            echo
            echo "| Package | Version | Dist-tag |"
            echo "| --- | --- | --- |"
            echo "| \`$PACKAGE_NAME\` | \`$VERSION\` | \`latest\` |"
            echo
            echo "Merging this labeled PR will publish the package."
          } >> "$GITHUB_STEP_SUMMARY"

  tag:
    name: Tag npm release
    if: >-
      github.event_name == 'pull_request_target' &&
      (
        github.event.pull_request.merged == true &&
        contains(github.event.pull_request.labels.*.name, 'npm package')
      )
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Resolve release metadata
        id: release
        working-directory: packages/auth
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::npm releases require a stable x.y.z version. Use the pkg.pr.new package preview instead."
            exit 1
          fi

          if npm view "$PACKAGE_NAME@$VERSION" version --json >/dev/null 2>&1; then
            echo "::error::$PACKAGE_NAME@$VERSION is already published."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Tag merged release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-list -n 1 "$TAG")
            HEAD_COMMIT=$(git rev-parse HEAD)
            if [[ "$TAG_COMMIT" != "$HEAD_COMMIT" ]]; then
              echo "::error::Tag $TAG already points to $TAG_COMMIT, not $HEAD_COMMIT."
              exit 1
            fi
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

          gh workflow run release.yml --ref main -f tag="$TAG"

  publish:
    name: Publish npm package
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24.15.0
          cache: true
          run-install: |
            args: ['--frozen-lockfile']

      - name: Configure npm trusted publishing
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Resolve release metadata
        id: release
        working-directory: packages/auth
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"

          if [[ "$RELEASE_TAG" != "$TAG" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match package version $VERSION."
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::npm releases require a stable x.y.z version. Use the pkg.pr.new package preview instead."
            exit 1
          fi

          if vp exec npm view "$PACKAGE_NAME@$VERSION" version --json >/dev/null 2>&1; then
            PUBLISHED=true
          else
            PUBLISHED=false
          fi

          echo "package=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"

      - name: Build package prerequisites
        run: |
          vp run '@robelest/convex-auth#build'

      - name: Run offline test suite
        run: vp test --run --project convex --project node

      - name: Run package publish checks
        run: |
          vp run '@robelest/convex-auth#typecheck:consumer'
          vp run '@robelest/convex-auth#typecheck:consumer:dist'
          vp run '@robelest/convex-auth#check:packaging'

      - name: Publish package
        if: steps.release.outputs.published != 'true'
        working-directory: packages/auth
        run: vp exec npm publish --ignore-scripts --provenance --tag latest

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.package }} ${{ steps.release.outputs.version }}
