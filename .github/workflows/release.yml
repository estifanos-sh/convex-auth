name: Release Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string
  pull_request_target:
    types:
      - closed

concurrency:
  group: release-package-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.event_name == 'pull_request_target' &&
      (
        github.event.pull_request.merged == true &&
        contains(github.event.pull_request.labels.*.name, 'npm package')
      )
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Resolve release tag
        id: release
        working-directory: packages/auth
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Tag merged release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-list -n 1 "$TAG")
            HEAD_COMMIT=$(git rev-parse HEAD)
            if [[ "$TAG_COMMIT" != "$HEAD_COMMIT" ]]; then
              echo "::error::Tag $TAG already points to $TAG_COMMIT, not $HEAD_COMMIT."
              exit 1
            fi
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

          gh workflow run release.yml --ref main -f tag="$TAG"

  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24.15.0
          cache: true
          run-install: |
            args: ['--frozen-lockfile']

      - name: Configure npm trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Resolve release metadata
        id: release
        working-directory: packages/auth
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"

          if [[ "$RELEASE_TAG" != "$TAG" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match package version $VERSION."
            exit 1
          fi

          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG=${VERSION#*-}
            DIST_TAG=${DIST_TAG%%.*}
          else
            DIST_TAG=latest
          fi

          if vp exec npm view "$PACKAGE_NAME@$VERSION" version --json >/dev/null 2>&1; then
            PUBLISHED=true
          else
            PUBLISHED=false
          fi

          echo "package=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"

      - name: Build package prerequisites
        run: |
          vp run '@robelest/convex-auth#build'

      - name: Run offline test suite
        run: vp test --run --project convex --project node

      - name: Run package publish checks
        run: |
          vp run '@robelest/convex-auth#typecheck:consumer'
          vp run '@robelest/convex-auth#typecheck:consumer:dist'
          vp run '@robelest/convex-auth#check:packaging'

      - name: Publish package
        if: steps.release.outputs.published != 'true'
        working-directory: packages/auth
        env:
          NPM_DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: vp exec npm publish --ignore-scripts --provenance --tag "$NPM_DIST_TAG"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.package }} ${{ steps.release.outputs.version }}
