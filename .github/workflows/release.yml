name: npm Release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      ref:
        description: Reviewed main-reachable release ref
        required: true
        default: main
        type: string
      tag:
        description: Matching v<version> release tag
        required: true
        type: string

concurrency:
  group: release-package-${{ inputs.tag || github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

jobs:
  readiness:
    name: Release readiness
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'npm package')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Validate release version
        id: release
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          BASE_VERSION=$(git show "$BASE_SHA:packages/auth/package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          BASE_VERSION="$BASE_VERSION" node scripts/release/policy.ts readiness

      - name: Verify release tag is available
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Git tag $RELEASE_TAG already exists."
            exit 1
          fi

      - name: Summarize release
        run: |
          {
            echo "## npm release"
            echo
            echo "| Package | Version | Dist-tag |"
            echo "| --- | --- | --- |"
            echo "| \`${{ steps.release.outputs.package }}\` | \`${{ steps.release.outputs.version }}\` | \`${{ steps.release.outputs.dist_tag }}\` |"
            echo
            echo "Merging this labeled PR will dispatch the reviewed release workflow."
          } >> "$GITHUB_STEP_SUMMARY"

  dispatch-release:
    name: Dispatch release
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'npm package')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Dispatch reviewed release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          VERSION=$(node -p "require('./packages/auth/package.json').version")
          gh workflow run release.yml --ref main \
            -f ref="$SHA" \
            -f tag="v$VERSION"

  publish:
    name: Publish npm package
    if: github.event_name == 'workflow_dispatch'
    # npm trusted publishing and provenance require a GitHub-hosted runner.
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - name: Verify release source and metadata
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          node scripts/release/policy.ts metadata
          if ! git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
            echo "::error::Releases must build a commit already reachable from main."
            exit 1
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24.15.0
          cache: true
          run-install: |
            args: ['--frozen-lockfile']

      - name: Configure npm trusted publishing
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Build package prerequisites
        run: vp run '@estifanos-sh/convex-auth#build'

      - name: Run offline test suite
        run: vp test --run --project convex --project node

      - name: Run package publish checks
        run: |
          vp run '@estifanos-sh/convex-auth#typecheck:consumer'
          vp run '@estifanos-sh/convex-auth#typecheck:consumer:dist'
          vp run '@estifanos-sh/convex-auth#check:packaging'

      - name: Create or verify exact release tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-list -n 1 "$RELEASE_TAG")
            if [[ "$TAG_SHA" != "$SOURCE_SHA" ]]; then
              echo "::error::Tag $RELEASE_TAG points to $TAG_SHA, not $SOURCE_SHA."
              exit 1
            fi
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$RELEASE_TAG" "$SOURCE_SHA" -m "@estifanos-sh/convex-auth $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Publish package with trusted publishing
        if: steps.release.outputs.published != 'true'
        working-directory: packages/auth
        env:
          NPM_CONFIG_PROVENANCE: "true"
          NPM_DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: npm publish --ignore-scripts --access public --tag "$NPM_DIST_TAG"

      - name: Verify npm release channel
        run: node scripts/release/policy.ts verify

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ steps.release.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.release.outputs.prerelease != 'true' }}
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.package }} ${{ steps.release.outputs.version }}
