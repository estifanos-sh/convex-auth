name: Deploy Demo

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy. Defaults to the current branch."
        required: false
        type: string

concurrency:
  group: convex-auth-demo
  cancel-in-progress: true

jobs:
  deploy-demo:
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      contents: read

    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      PUBLIC_DEPLOYMENT_ENV: production

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24.15.0
          cache: true
          run-install: |
            args: ['--frozen-lockfile']

      - name: Deploy demo backend and site
        run: vp exec convex deploy --cmd 'vp run build:demo' --cmd-url-env-var-name VITE_CONVEX_URL

      - name: Upload demo static assets
        run: vp exec static-hosting upload --prod --dist demos/svelte/build
