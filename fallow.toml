# Runtime roots that are not discoverable from package exports or framework plugins.
entry = [
  "vite.config.ts",
  "packages/auth/consumer/types.ts",
  "packages/auth/src/cli/bin.ts",
  "packages/auth/scripts/**/*.ts",
  "scripts/**/*.ts",
  "tests/infra/docker/setup/node.ts",
  "tests/vitest/setup.ts",
]

ignorePatterns = [
  "**/_generated/**",
  "**/.expo/**",
  "**/.svelte-kit/**",
  "docs/src/generated/**",
  "docs/src/routeTree.gen.ts",
]

# Loaded by CLIs, framework configuration, or optional platform adapters.
ignoreDependencies = [
  "@arethetypeswrong/cli",
  "@edge-runtime/vm",
  "@oxlint/plugins",
  "@react-navigation/bottom-tabs",
  "@react-navigation/elements",
  "@sveltejs/package",
  "@trestleinc/convex-oxlint",
  "expo-auth-session",
  "expo-secure-store",
  "expo-splash-screen",
  "expo-system-ui",
  "expo-web-browser",
  "pkg-pr-new",
  "publint",
  "react-native-css",
  "react-native-gesture-handler",
  "react-native-passkey",
  "react-native-web",
]

ignoreDependencyOverrides = [
  { package = "vitest", source = "package.json" },
  { package = "vitest", source = "pnpm-workspace.yaml" },
]

[workspaces]
packages = ["packages/*", "demos/*", "tests", "docs"]

[duplicates]
minOccurrences = 3

[audit]
gate = "new-only"
typeAware = true

[rules]
unused-files = "error"
private-type-leaks = "off"
unused-dependencies = "error"
duplicate-exports = "off"
# Fallow does not count catalog values consumed through pnpm overrides. Both
# root overrides below intentionally resolve vitest through the default catalog.
unused-catalog-entries = "off"

[[overrides]]
files = ["packages/auth/src/component/**"]
rules = { unused-exports = "warn", unused-types = "warn", private-type-leaks = "off" }
